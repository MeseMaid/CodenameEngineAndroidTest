name: Android Builds

on:
  push:
  workflow_dispatch:

env:
  HAXE_VERSION: 4.3.7
  HXCPP_COMPILE_CACHE: ${{ github.workspace }}/.hxcpp_cache
  NDK_VERSION: 27.0.12077973  

jobs:
  build:
    name: Android Build
    runs-on: ubuntu-24.04
    steps:
      - name: Pulling the new commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
      - name: Setting up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setting up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Installing SDK platform, build-tools and NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${{ env.NDK_VERSION }}"
      # lime's command line tools still need the Linux (host) lime.ndll, same as linux.yml
      - name: Installing Packages for Building Lime
        run: |
          sudo apt-get update
          sudo apt-get install -qq \
          libegl1-mesa-dev libgl1-mesa-dev libibus-1.0-dev libdbus-1-dev libdecor-0-dev libudev-dev libgbm-dev libdrm-dev \
          libpng-dev libturbojpeg-dev libvorbis-dev libopenal-dev libsdl2-dev libglu1-mesa-dev libmbedtls-dev libuv1-dev libsqlite3-dev \
          libx11-dev libxext-dev libxfixes-dev libxi-dev libxinerama-dev libxkbcommon-dev libxcursor-dev libxrandr-dev libxss-dev libxt-dev libxtst-dev libxv-dev libxxf86vm-dev \
          libpulse-dev libasound2-dev libpipewire-0.3-dev
      - name: Installing/Updating libraries
        run: |
          haxelib --global update haxelib
          haxe -cp commandline -D analyzer-optimize --run Main setup -si
      - name: Rebuilding Lime
        run: |
          haxelib run lime rebuild hxcpp
          haxelib run lime rebuild tools
          haxelib run lime rebuild linux -nocolor -release
      - name: Configuring Lime for Android
        run: |
          haxelib run lime setup -alias -y -nocffi
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true
      - name: Rebuilding Lime for Android
        run: |
          haxelib run lime rebuild android -nocolor -release
      - name: Building the game
        run: |
          haxelib run lime build android -DCOMPILE_EXPERIMENTAL
      - name: Uploading APK
        uses: actions/upload-artifact@v7
        with:
          name: Codename Engine Android
          path: export/release/android/bin/app/build/outputs/apk/**/*.apk
